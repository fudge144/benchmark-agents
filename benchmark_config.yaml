# Benchmark Configuration
# API keys are resolved from env vars at runtime — never store secrets here.

api:
  openrouter_api_key_env: OPENROUTER_API_KEY
  upstage_api_key_env: UPSTAGE_API_KEY
  gemini_api_key_env: GEMINI_API_KEY

models:
  # Short name -> OpenRouter model ID(s)
  kimi:
    - moonshotai/kimi-k3
    - moonshotai/kimi-k2.7-code
    - moonshotai/kimi-k2.6
  fable:
    - anthropic/claude-fable-5.1
    - anthropic/claude-fable-5
  gpt4o:
    - openai/gpt-4o
  claude:
    - anthropic/claude-sonnet-4
  gemini:
    - google/gemini-2.5-pro
  deepseek:
    - deepseek/deepseek-v3

benchmarks:
  # Standard lm-eval tasks
  - mmlu
  - gsm8k
  - hellaswag
  - arc_easy
  - arc_challenge
  - truthfulqa

schedule:
  # Cron expression (crontab format) — runs daily at 03:00 UTC
  benchmark_cron: "0 3 * * *"
  # How many days of history to keep in the dashboard
  history_days: 30

dashboard:
  host: "0.0.0.0"
  port: 8765
  # The URL you bookmark on your Android phone:
  # https://<your-hermes-dashboard-url>/app/benchmarks
